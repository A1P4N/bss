[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "bss"
version = "0.1.0"
description = "BSS Structural Monitoring Agent"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
loader = "bss.historical_loader.cli.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]